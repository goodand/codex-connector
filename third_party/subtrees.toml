subtree_prefix = "third_party/subtrees/backstopjs"
import_mode = "package_dependency"
decision = "package_dependency"
requires_entrypoint_review = false
adapter = "src/validate/backstopRunner.ts"
validation_command = "npm test"
notes = "Config-driven visual regression app; better as package dependency or external CLI"

[[subtrees]]
id = "opendataloader_pdf_core"
full_name = "opendataloader-project/opendataloader-pdf"
upstream_url = "https://github.com/opendataloader-project/opendataloader-pdf.git"
upstream_ref = "main"
